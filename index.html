<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road GPS-VTS Annexure Manager</title>
<meta name="theme-color" content="#1A5CBA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GPS-VTS">
<meta name="description" content="GPS-VTS road works annexure manager: roller passes and material quantity monitoring">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --sign:#1A5CBA; --sign-2:#0E4698; --sign-ink:#FFFFFF; --stone:#F2A33A;
  --bg:#F9FAFB; --surface:#FFFFFF; --ink:#1F2937; --muted:#6B7280; --line:#E5E7EB; --line-2:#F1F3F6;
  --input:#FFF6C7; --input-line:#DCC86E; --select:#FFE3C7; --select-line:#E2AC75; --calc:#F3F5F8;
  --ok:#1C7343; --ok-soft:#DCF0E3; --bad:#B42318; --bad-soft:#FBE4E1; --warn:#8A5A00; --warn-soft:#FCEFD3;
  --info-soft:#E3EEF9; --focus:#2E6BE6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sign:#2F6FD6; --sign-2:#1A5CBA; --bg:#0E1422; --surface:#151D2E; --ink:#E5EAF3; --muted:#9BA7C0;
    --line:#2A3448; --line-2:#212A3B; --input:#3A3315; --input-line:#6E6024; --select:#3D2918; --select-line:#7C5432;
    --calc:#1B2436; --ok:#62C98F; --ok-soft:#163826; --bad:#F2887D; --bad-soft:#3E1C19; --warn:#E9B957; --warn-soft:#3A2D12;
    --info-soft:#1A2A3A; --focus:#7EA6FF;
  }
}
:root[data-theme="dark"]{
  --sign:#2F6FD6; --sign-2:#1A5CBA; --bg:#0E1422; --surface:#151D2E; --ink:#E5EAF3; --muted:#9BA7C0;
  --line:#2A3448; --line-2:#212A3B; --input:#3A3315; --input-line:#6E6024; --select:#3D2918; --select-line:#7C5432;
  --calc:#1B2436; --ok:#62C98F; --ok-soft:#163826; --bad:#F2887D; --bad-soft:#3E1C19; --warn:#E9B957; --warn-soft:#3A2D12;
  --info-soft:#1A2A3A; --focus:#7EA6FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14.5px;line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(90deg,#1E5FBF 0%,#0E4698 100%);color:var(--sign-ink);padding:0 0 14px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100vh;overflow:auto;overflow-x:hidden}
.brand{display:flex;align-items:center;gap:12px;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.28);min-height:74px}
.logo{width:40px;height:40px;flex:none;display:grid;place-items:center}
.logo svg{width:36px;height:36px}
.bt b{display:block;font-size:18px;font-weight:700;line-height:1.15;letter-spacing:.01em}
.bt span{display:block;font-size:11.5px;opacity:.82;margin-top:2px;line-height:1.3}
.nav{display:flex;flex-direction:column;gap:3px;padding:6px 12px 0}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;text-decoration:none;font-weight:500;color:rgba(255,255,255,.88);white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.10);color:#fff}
.nav a.on{background:rgba(255,255,255,.18);color:#fff;font-weight:600}
.nav svg{width:22px;height:22px;flex:none;stroke-width:1.6}
.nav .grp{font-size:11.5px;opacity:.65;padding:14px 12px 4px;font-weight:500}
.side-foot{margin-top:auto;padding:0 12px;display:flex;flex-direction:column;gap:10px}
.rail-btn{display:flex;align-items:center;gap:12px;width:100%;background:transparent;border:0;color:rgba(255,255,255,.88);padding:10px 12px;border-radius:9px;cursor:pointer;font-weight:500;white-space:nowrap}
.rail-btn:hover{background:rgba(255,255,255,.10);color:#fff}
.rail-btn svg{width:22px;height:22px;flex:none;transition:transform .2s}
.mode{font-size:12px;line-height:1.35;background:rgba(0,0,0,.14);border-radius:9px;padding:10px 11px}
.mode b{display:block;font-weight:600;margin-bottom:2px}
.mode .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:#8fe3b0}
.mode.local .dot{background:var(--stone)}
.app{transition:grid-template-columns .2s}
.app.rail{grid-template-columns:76px minmax(0,1fr)}
.app.rail .bt,.app.rail .nav .t,.app.rail .nav .grp,.app.rail .rail-btn .t,.app.rail .mode{display:none}
.app.rail .brand{justify-content:center;padding:18px 0 16px}
.app.rail .nav{padding:10px 12px 0;gap:8px}
.app.rail .nav a,.app.rail .rail-btn{justify-content:center;padding:11px 0}
.app.rail .rail-btn svg{transform:rotate(180deg)}
main{padding:26px 34px 72px;min-width:0}
.wrap{max-width:1380px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:4px}
.crumbs a{color:var(--muted);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
h1{font-size:27px;line-height:1.15;font-weight:800;margin:0;letter-spacing:-.005em}
h2{font-size:18px;font-weight:800;margin:0}
h3{font-size:15.5px;font-weight:700;margin:0}
.sub{color:var(--muted);margin:4px 0 0;max-width:72ch}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;font-weight:600;cursor:pointer;line-height:1.3;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--sign);border-color:var(--sign);color:#fff}
.btn.primary:hover{background:var(--sign-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;padding:5px 8px}
.btn.ghost:hover{background:var(--line-2)}
.btn.sm{padding:4px 9px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:1px solid transparent;background:transparent;border-radius:6px;width:28px;height:28px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--line-2);color:var(--ink)}
.icon-btn.del:hover{color:var(--bad)}
.icon-btn:disabled{opacity:.3;cursor:not-allowed}
.icon-btn svg{width:16px;height:16px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:18px}
.panel-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel-h .sub{margin:0;font-size:13.5px}
.panel-b{padding:16px}
.panel-b.flush{padding:0}

.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:span 2}
.fld label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.fld .req{color:var(--bad);margin-left:2px}
.ctl{position:relative;display:flex;align-items:center}
.ctl .unit{position:absolute;right:9px;font-size:12.5px;color:var(--muted);pointer-events:none}
.in,.sel,.txt{width:100%;border-radius:6px;padding:7px 9px;min-height:36px;border:1px solid var(--line);background:var(--surface)}
.in{background:var(--input);border-color:var(--input-line)}
.in.has-unit{padding-right:34px}
.sel{background:var(--select);border-color:var(--select-line);appearance:auto}
.txt{background:var(--surface)}
.in[readonly],.sel:disabled,.txt[readonly]{background:var(--calc);border-color:var(--line-2);color:var(--ink);opacity:1}
.in.bad,.sel.bad,.txt.bad{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.err{font-size:12.5px;color:var(--bad);font-weight:600;min-height:0}
.err:empty{display:none}
.hint{font-size:12.5px;color:var(--muted)}
.linkish{background:none;border:0;padding:0;color:var(--sign);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
:root[data-theme="dark"] .linkish{color:#93B4FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .linkish{color:#93B4FF}}

.tbl-wrap{overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.grid th{font-size:12.5px;font-weight:700;color:var(--muted);text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:bottom;line-height:1.3;background:var(--surface)}
.grid td{padding:7px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.grid tr:last-child td{border-bottom:0}
.grid td.num,.grid th.num{text-align:right}
.grid td.c{background:var(--calc)}
.grid th.calc-h{background:var(--calc)}
.res{display:flex;flex-direction:column;gap:5px;min-width:210px}
.res-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line-2);gap:2px}
.res-bar .ok{background:var(--ok)}.res-bar .bad{background:var(--bad)}.res-bar .pend{background:var(--warn);opacity:.6}
.res-pills{display:flex;flex-wrap:wrap;gap:4px}
.grid th{position:relative}
.col-rz{position:absolute;top:0;right:-3px;bottom:0;width:8px;cursor:col-resize;z-index:2;touch-action:none}
.col-rz::after{content:"";position:absolute;top:22%;bottom:22%;left:3px;width:2px;border-radius:1px;background:var(--line)}
.col-rz:hover::after,.col-rz.on::after{background:var(--sign);top:0;bottom:0}
body.resizing{cursor:col-resize;user-select:none}
.pass-in{display:flex;align-items:center;gap:4px}.pass-in .in{min-width:0;width:100%;text-align:center;padding-left:4px;padding-right:4px}.pass-in span{color:var(--muted)}
textarea.small-in{font-size:12.5px;line-height:1.35;resize:none;overflow:hidden;min-height:34px;padding-top:7px;padding-bottom:7px;display:block}
.grid td.small{font-size:12.5px;line-height:1.35}
.grid td.ro-cell{padding-top:10px}
.a1-combined th{font-size:12px;line-height:1.3;vertical-align:bottom;padding:8px 6px}
.a1-combined td{padding:6px;vertical-align:top}
.a1-combined td.idx{padding-top:14px;text-align:center;color:var(--muted)}
.a1-combined .grp-row th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--sign);text-align:center;padding:7px 6px;border-bottom:1px solid var(--line);border-left:2px solid var(--surface)}
.a1-combined .grp-row th.grp:not(:empty){background:color-mix(in srgb,var(--sign) 7%,var(--surface))}
.a1-combined td.c{padding-top:13px}
.a1-combined td.c.small{padding-top:9px}
.a1-combined td.num .in,.a1-combined input[inputmode="decimal"]{text-align:right}
.a1-combined .pass-in input[inputmode="decimal"]{text-align:center}
.a1-combined .sel{padding-right:4px}
.a1-combined tbody tr:hover td{background:color-mix(in srgb,var(--sign) 3%,transparent)}
.a1-combined tbody tr:hover td.c{background:var(--calc)}
.a1-combined td .cell-sub{display:block;margin-top:3px}
.a1-combined td.acts{padding-top:9px}
.a1-combined td.acts .icon-btn{width:24px;height:26px}
/* centred report tables */
.a1-combined th,.a1-combined td,.grid.ctr th,.grid.ctr td{text-align:center!important;vertical-align:middle!important}
.a1-combined td,.a1-combined td.c,.a1-combined td.c.small,.a1-combined td.idx,.a1-combined td.acts,.a1-combined td.ro-cell{padding:8px 6px}
.a1-combined .in,.a1-combined input[inputmode="decimal"],.grid.ctr .in{text-align:center!important}
.a1-combined .sel,.grid.ctr .sel{text-align:center;text-align-last:center}
.a1-combined .pass-in{justify-content:center}
.a1-combined .pass-in .in{max-width:52px}
.a1-combined td .cell-sub{text-align:center}
.a1-combined .pill,.grid.ctr .pill{justify-content:center}
.a1-combined td.acts{white-space:nowrap}
.a1-combined .sel{padding-left:7px}
.grid td.c{vertical-align:top;padding-top:12px}
.view .in,.view .sel,.view .txt{background:transparent!important;border-color:transparent!important;box-shadow:none!important;padding-left:0;appearance:none;-webkit-appearance:none;cursor:default}
.view .ctl .unit{position:static;margin-left:4px}
.view .ctl{justify-content:flex-start}
.grid td.idx{color:var(--muted);font-weight:700;width:30px;padding-top:15px}
.grid .in,.grid .sel,.grid .txt{min-height:34px;padding:6px 8px}
.grid tbody tr.clickable{cursor:pointer}
.grid tbody tr.clickable:hover td{background:var(--line-2)}
.grid td.acts{white-space:nowrap;text-align:right;width:1%}
.grid .unit-h{font-weight:400}
.cell-main{font-weight:700}
.cell-sub{font-size:12.5px;color:var(--muted)}
.pending{color:var(--warn);font-size:13px;font-weight:600}
.big-num{font-size:16px;font-weight:800}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px 1px;font-size:12.5px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.draft{background:var(--warn-soft);color:var(--warn)}
.pill.final{background:var(--ok-soft);color:var(--ok)}
.pill.arch{background:var(--line-2);color:var(--muted);border-color:var(--line)}
.pill.plain{background:var(--line-2);color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid}
.legend .y{background:var(--input);border-color:var(--input-line)}
.legend .o{background:var(--select);border-color:var(--select-line)}
.legend .g{background:var(--calc);border-color:var(--line)}

.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:8px;margin-bottom:16px;font-size:14px}
.banner.info{background:var(--info-soft)}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner.ok{background:var(--ok-soft)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:18px;overflow:hidden}
.stat{padding:14px 18px;border-right:1px solid var(--line-2)}
.stat:last-child{border-right:0}
.stat .k{font-size:13px;color:var(--muted);font-weight:600}
.stat .v{font-size:24px;font-weight:800;line-height:1.2;margin-top:2px}
.stat .d{font-size:12.5px;color:var(--muted)}

.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}
.quick a{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-decoration:none}
.quick a:hover{border-color:var(--sign)}
.quick .ico{width:44px;height:44px;border-radius:8px;background:var(--sign);display:grid;place-items:center;flex:none;color:#fff;font-weight:800;font-size:15px}
.quick .ico.ii{background:var(--stone);color:#3a2300}
.quick b{display:block;font-size:15.5px}
.quick span{font-size:13.5px;color:var(--muted)}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding:12px 16px;border-bottom:1px solid var(--line)}
.filters .fld{min-width:150px}
.filters .fld.grow{flex:1;min-width:220px}

.empty{padding:38px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.empty p{margin:0 auto 14px;max-width:52ch}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:9px 14px;text-decoration:none;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a.on{color:var(--ink);border-bottom-color:var(--sign)}

.xsec{display:block;width:100%;height:auto}
.xsec .band{stroke-width:1.5}
.xsec .band.ok{fill:var(--ok-soft);stroke:var(--ok)}
.xsec .band.bad{fill:var(--bad-soft);stroke:var(--bad)}
.xsec .band.pend{fill:var(--calc);stroke:var(--muted);stroke-dasharray:5 4}
.xsec text{fill:var(--ink);font-family:inherit}
.xsec .lab{font-size:13px;font-weight:700}
.xsec .lab2{font-size:12px;fill:var(--muted)}
.xsec .st-ok{fill:var(--ok);font-weight:800;font-size:12px}
.xsec .st-bad{fill:var(--bad);font-weight:800;font-size:12px}
.xsec .st-pend{fill:var(--warn);font-weight:800;font-size:12px}
.xsec .ground{stroke:var(--muted);stroke-width:1}
.xsec .dim{stroke:var(--muted);stroke-width:1}
.xsec .cl{stroke:var(--muted);stroke-dasharray:2 4}

.mat{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:16px}
.mat-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--line-2);border-radius:10px 10px 0 0}
.mat-h .no{width:28px;height:28px;border-radius:50%;background:var(--sign);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13.5px;flex:none}
.mat-b{padding:14px}
.mat-f{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--calc);border-radius:0 0 10px 10px}
.kv{display:flex;flex-direction:column}
.kv .k{font-size:12.5px;color:var(--muted);font-weight:600}
.kv .v{font-size:17px;font-weight:800}

.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(140px,220px) 1fr 80px;gap:12px;align-items:center}
.bar{height:16px;background:var(--line-2);border-radius:4px;position:relative;overflow:hidden;border:1px solid var(--line)}
.bar > span{position:absolute;left:0;top:0;bottom:0;background:var(--sign);border-radius:3px 0 0 3px}
.bar > span.low{background:var(--stone)}
.bar-row .pct{font-weight:800;text-align:right}

.hist{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 18px}
.formula{font-size:13px;color:var(--muted);line-height:1.6}
.formula code{font-family:inherit;font-weight:700;color:var(--ink);background:var(--calc);padding:1px 6px;border-radius:4px}

.scrim{position:fixed;inset:0;background:rgba(10,15,30,.45);display:grid;place-items:center;padding:20px;z-index:50}
.dlg{background:var(--surface);color:var(--ink);border-radius:12px;width:min(620px,100%);max-height:calc(100% - 20px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.dlg.small{width:min(440px,100%)}
.dlg-h{padding:16px 20px 0}
.dlg-b{padding:14px 20px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px 18px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-weight:600}
.check input{width:16px;height:16px}
.sticky-actions{position:sticky;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(4px);border-top:1px solid var(--line);margin:0 -34px;padding:10px 34px calc(10px + env(safe-area-inset-bottom,0px))}
.dirty-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--stone);margin-right:6px}

.out-sheet{overflow:hidden}
.out-band{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:14px 18px;background:linear-gradient(90deg,#1E5FBF,#0E4698);color:#fff}
.out-band span{font-size:12px;font-weight:600;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.out-band b{font-size:16px;font-weight:600}
.out-info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.oi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.oi .k{font-size:12px;color:var(--muted);font-weight:600}
.oi .v{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.out-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.kpi{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.kpi .n{font-size:24px;font-weight:800;line-height:1.15}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi.ok{background:var(--ok-soft);border-color:transparent}.kpi.ok .n,.kpi.ok .l{color:var(--ok)}
.kpi.bad{background:var(--bad-soft);border-color:transparent}.kpi.bad .n,.kpi.bad .l{color:var(--bad)}
.kpi.warn{background:var(--warn-soft);border-color:transparent}.kpi.warn .n,.kpi.warn .l{color:var(--warn)}
.out-sec{font-size:13px;letter-spacing:.04em;color:var(--sign);margin:6px 0 10px}
.out-tbl{border:1px solid var(--line);border-radius:10px;border-collapse:separate;overflow:hidden}
.out-tbl th{background:var(--calc)}
.out-tbl td .cell-sub{display:block}
.nav .ts{display:none}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.chart-card{margin:0;border:1px solid var(--line);border-radius:10px;padding:14px 14px 8px;background:var(--surface);break-inside:avoid}
.chart-card figcaption{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.chart-card figcaption b{font-size:14.5px}
.chart-card figcaption span{font-size:12.5px;color:var(--muted)}
.chart{display:block;width:100%;height:auto;font-family:inherit}
.chart .ch-s1{fill:#5B9BD5}
.chart .ch-s1.below{fill:#5B9BD5;opacity:.75}
.chart .ch-s2{fill:#ED7D31}
.chart .ch-grid{stroke:var(--line);stroke-width:1}
.chart .ch-axis{stroke:var(--muted);stroke-width:1}
.chart .ch-ref{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4}
.chart .ch-reflab{font-size:10.5px;fill:var(--bad);font-weight:600}
.chart .ch-tick{font-size:11px;fill:var(--muted)}
.chart .ch-cat{font-size:11.5px;fill:var(--ink);font-weight:600}
.chart .ch-val{font-size:10.5px;fill:var(--ink)}
.chart .ch-val.strong{font-size:12px;font-weight:700}
.chart .ch-leg{font-size:11.5px;fill:var(--ink)}
.chart .ch-axlabel{font-size:12px;fill:var(--muted);font-weight:600}
@media (max-width:640px){
  .grid.resp thead{display:none}
  .grid.resp,.grid.resp tbody,.grid.resp tr{display:block;width:100%}
  .grid.resp tr{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:4px 12px;background:var(--surface)}
  .tbl-wrap > .grid.resp{padding:10px;border:0}
  .grid.resp td{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border:0!important;padding:7px 0!important;text-align:right!important;background:transparent!important;border-bottom:1px solid var(--line-2)!important}
  .grid.resp td:last-child{border-bottom:0!important}
  .grid.resp td::before{content:attr(data-label);font-size:12px;font-weight:600;color:var(--muted);text-align:left;flex:none;max-width:45%}
  .grid.resp td[data-label=""]::before{content:none}
  .grid.resp td > *{text-align:right}
  .grid.resp td{width:100%!important;min-width:0!important}
  .grid.resp td.acts{justify-content:flex-end;gap:6px;flex-wrap:wrap;white-space:normal}
  .grid.resp td > div,.grid.resp td > span{min-width:0}
  .grid.resp td .res{min-width:0;align-items:flex-end}
  .grid.resp td .res-pills{justify-content:flex-end}
  .out-info{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters .fld{min-width:0;flex:1 1 140px}
  h1{font-size:22px}
  .top{margin-bottom:14px}
  .panel-h{padding:12px 14px}
  .top > .row{width:100%}
  .top > .row .btn{flex:1 1 auto;justify-content:center}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;margin-top:calc(-1 * env(safe-area-inset-top,0px));gap:12px;overflow:visible;background:linear-gradient(90deg,#1E5FBF,#0E4698)}
  .app.rail{grid-template-columns:1fr}
  .brand{padding:4px 6px;border:0;min-height:0;flex:none}
  .bt span{display:none}.bt b{font-size:15px}
  .app.rail .bt,.app.rail .nav .t{display:block}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:30;flex-direction:row;justify-content:space-around;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:linear-gradient(90deg,#1E5FBF,#0E4698);box-shadow:0 -4px 16px rgba(0,0,0,.12)}
  .nav .grp{display:none}
  .nav a{flex:1 1 0;flex-direction:column;gap:3px;padding:6px 2px;font-size:11px;justify-content:center;text-align:center;border-radius:8px;min-width:0}
  .nav a .t,.app.rail .nav .t{display:none}
  .nav a .ts{display:block;white-space:nowrap}
  .nav a.on{background:rgba(255,255,255,.2)}
  .nav svg{width:22px;height:22px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .side-foot{display:none}
  .mode{display:none}
  main{padding:16px 12px calc(96px + env(safe-area-inset-bottom,0px))}
  .sticky-actions{margin:0 -12px;padding:10px 12px;bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .sticky-actions .hint{display:none}
  .out-info{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line-2)}
  .quick{grid-template-columns:1fr}
  .fld.wide{grid-column:auto}
  .bar-row{grid-template-columns:1fr 64px}.bar-row .bar{grid-column:1 / -1;order:3}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media print{
  .side,.nav,.no-print,.sticky-actions,.icon-btn,.btn,.filters,.toast,.col-rz{display:none!important}
  .out-band{background:#fff!important;color:#000!important;border-bottom:2px solid #000}
  .app{display:block}
  main{padding:0}
  body{background:#fff;color:#000;font-size:12px}
  .panel,.mat{border-color:#999;break-inside:avoid}
  .in,.sel,.txt{border:0;background:transparent!important;box-shadow:none;padding:0;min-height:0;appearance:none}
  .grid td.c{background:#f2f2f2}
}

/* ---------------- charts (inline SVG, workbook style) ---------------- */
function wrapLabel(t, max = 13) {
  const words = String(t || '').split(/\s+/).filter(Boolean), lines = [];
  let cur = '';
  words.forEach(w => { if ((cur + ' ' + w).trim().length > max && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
  if (cur) lines.push(cur);
  if (lines.length > 3) { lines.length = 3; lines[2] += '…'; }
  return lines;
}
function niceMax(v) {
  if (!(v > 0)) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  const m = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find(x => n <= x + 1e-9);
  return m * p;
}
/* grouped vertical columns: series = [{ name, cls, values }] */
function columnChart({ cats, series, yLabel, fmtV = v => fmt(v), title, wide }) {
  const W = wide ? 980 : 600, H = wide ? 360 : 340, L = 62, R = 14, T = 18, B = 92;
  const pw = W - L - R, ph = H - T - B;
  const all = series.flatMap(x => x.values).filter(v => v !== null && isFinite(v));
  const raw = Math.max(0, ...all) * 1.12 || 1;
  const p10 = Math.pow(10, Math.floor(Math.log10(raw / 5)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p10).find(st => raw / st <= 6);
  const nT = Math.ceil(raw / step), max = nT * step;
  const y = v => T + ph - (v / max) * ph;
  const gw = pw / Math.max(1, cats.length), n = series.length;
  const bw = Math.min(wide ? 56 : 42, (gw * 0.7) / n);
  let g = '';
  for (let k = 0; k <= nT; k++) { const v = step * k, yy = y(v); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" class="ch-grid"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end" class="ch-tick">${fmtTick(v)}</text>`; }
  cats.forEach((c, i) => {
    const cx = L + gw * i + gw / 2, x0 = cx - (bw * n) / 2;
    series.forEach((sr, j) => {
      const v = sr.values[i], x = x0 + j * bw + 2;
      if (v === null || !isFinite(v)) { g += `<text x="${x + (bw - 4) / 2}" y="${y(0) - 6}" text-anchor="middle" class="ch-val">—</text>`; return; }
      g += `<rect x="${x}" y="${y(v)}" width="${bw - 4}" height="${Math.max(0, y(0) - y(v))}" class="${sr.cls}"><title>${esc(c)}: ${esc(sr.name)} ${fmtV(v)}</title></rect>`;
      g += `<text x="${x + (bw - 4) / 2}" y="${y(v) - 5}" text-anchor="middle" class="ch-val">${fmtV(v)}</text>`;
    });
    wrapLabel(c).forEach((ln, li) => { g += `<text x="${cx}" y="${T + ph + 18 + li * 14}" text-anchor="middle" class="ch-cat">${esc(ln)}</text>`; });
  });
  g += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" class="ch-axis"/>`;
  g += `<text transform="translate(16 ${T + ph / 2}) rotate(-90)" text-anchor="middle" class="ch-axlabel">${esc(yLabel)}</text>`;
  let lx = L; const ly = H - 14;
  series.forEach(sr => { g += `<rect x="${lx}" y="${ly - 9}" width="11" height="11" class="${sr.cls}"/><text x="${lx + 16}" y="${ly}" class="ch-leg">${esc(sr.name)}</text>`; lx += 24 + sr.name.length * 6.6; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg>`;
}
function fmtTick(v) { return Math.abs(v) >= 100 || Number.isInteger(v) ? String(Math.round(v * 100) / 100) : v.toFixed(1); }
/* horizontal % bars with optional 100% reference */
function percentBars({ cats, values, title, statuses }) {
  const rowH = 46, W = 600, L = 132, R = 72, T = 14, B = 34;
  const H = T + B + rowH * Math.max(1, cats.length), pw = W - L - R;
  const vmax = Math.max(0, ...values.filter(v => v !== null && isFinite(v)));
  const max = vmax <= 100 ? 100 : Math.ceil((vmax * 1.08) / 25) * 25;
  const x = v => L + (Math.min(v, max) / max) * pw;
  let g = '';
  const ticks = []; for (let t = 0; t <= max + 1e-9; t += max > 150 ? 50 : 25) ticks.push(t);
  ticks.forEach(t => { g += `<line x1="${x(t)}" x2="${x(t)}" y1="${T}" y2="${H - B}" class="ch-grid"/><text x="${x(t)}" y="${H - B + 18}" text-anchor="middle" class="ch-tick">${fmt(t, t % 1 ? 1 : 0)}%</text>`; });
  cats.forEach((c, i) => {
    const yc = T + rowH * i + rowH / 2, v = values[i];
    const lines = wrapLabel(c, 16);
    lines.forEach((ln, li) => { g += `<text x="${L - 10}" y="${yc + 4 + (li - (lines.length - 1) / 2) * 13}" text-anchor="end" class="ch-cat">${esc(ln)}</text>`; });
    if (v === null || !isFinite(v)) { g += `<text x="${L + 6}" y="${yc + 4}" class="ch-val">Pending input</text>`; return; }
    const st = statuses ? statuses[i] : null;
    g += `<rect x="${L}" y="${yc - 11}" width="${Math.max(1, x(v) - L)}" height="22" rx="2" class="${st === 'Unsatisfactory' ? 'ch-s1 below' : 'ch-s1'}"><title>${esc(c)}: ${fmt(v)}%</title></rect>`;
    g += `<text x="${x(v) + 6}" y="${yc + 4}" class="ch-val strong">${fmt(v)}%${st ? (st === 'Satisfactory' ? ' ✓' : ' ✕') : ''}</text>`;
  });
  if (statuses) g += `<line x1="${x(100)}" x2="${x(100)}" y1="${T - 4}" y2="${H - B}" class="ch-ref"/><text x="${x(100)}" y="${T - 2}" text-anchor="middle" class="ch-reflab">100% = recommended average</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg>`;
}
function chartCard(title, sub, svg) { return `<figure class="chart-card"><figcaption><b>${esc(title)}</b>${sub ? `<span>${esc(sub)}</span>` : ''}</figcaption>${svg}</figure>`; }

async function editorAction(act) {
  const kind = E.kind, coll = kind === 'a1' ? 'a1reports' : 'a2reports';
  const label = kind === 'a1' ? 'Annexure I' : 'Annexure II';
  if (act === 'save' || act === 'finalize') {
    const finalize = act === 'finalize';
    E.attempted = finalize || E.attempted;
    const errs = kind === 'a1' ? valA1(E.doc) : valA2(E.doc);
    const blk = blocking(errs, finalize);
    if (blk.length) {
      if (!finalize) { E.attempted = true; }
      showErrors();
      toast(finalize ? `Complete ${blk.length} highlighted field${blk.length === 1 ? '' : 's'} before finalizing` : 'Fix the highlighted fields to save');
      const first = $$('.bad', main())[0]; if (first) { first.scrollIntoView({ block: 'center', behavior: 'smooth' }); first.focus({ preventScroll: true }); }
      return;
    }
    if (finalize && !(await confirmDlg({ title: 'Finalize this report?', body: 'All values will be recalculated and locked. You can reopen it later with Edit report if changes are needed.', ok: 'Finalize report' }))) return;
    const d = clone(E.doc), t = nowISO(), isNew = E.id === 'new';
    const newPkg = String(d.packageNo || '').trim(); delete d.packageNo;
    const rdx = road(d.roadId);
    if (rdx && newPkg && rdx.packageNo !== newPkg) { try { await put('roads', Object.assign(clone(rdx), { packageNo: newPkg, updatedAt: t })); } catch (e) { toast(writeErr(e)); return; } }
    if (isNew) { d.id = kind + '-' + uid(); d.createdAt = t; }
    d.updatedAt = t;
    d.history = (d.history || []).concat(isNew ? [{ action: 'Created', at: t }] : []).concat(finalize ? [{ action: 'Finalized', at: t }] : (isNew ? [] : [{ action: 'Draft saved', at: t }]));
    if (finalize) d.status = 'FINALIZED';
    /* store a calculated snapshot alongside the raw inputs */
    d.calcSnapshot = kind === 'a1' ? Calc.a1(d).summary : (() => { const c = Calc.a2(d); return { overall: c.overall, dpr: c.dpr, vts: c.vts }; })();
    try {
      await put(coll, d);
      E.dirty = false;
      toast(finalize ? 'Report finalized' : 'Draft saved');
      E = null;
      location.hash = `#/${kind}`;
    } catch (e) { toast(writeErr(e)); }
    return;
  }
  if (act === 'delete') {
    const what = E.doc.status === 'DRAFT' ? 'draft' : 'finalized report';
    if (await confirmDlg({ title: `Delete this ${what}?`, body: `This ${what} will be permanently deleted. This cannot be undone.`, ok: 'Delete report', danger: true })) {
      try { await remove(coll, E.id); E.dirty = false; toast('Report deleted'); location.hash = `#/${kind}`; } catch (e) { toast(writeErr(e)); }
    }
    return;
  }
  if (act === 'reopen') {
    if (!(await confirmDlg({ title: 'Edit this finalized report?', body: 'The report will go back to <b>Draft</b> so you can change it. Finalize it again when you are done. This is recorded in the activity history.', ok: 'Edit report' }))) return;
    try { await setReportStatus(kind, E.id, 'DRAFT', 'Reopened for editing'); toast('Report reopened as draft'); E = null; route(); } catch (e) { toast(writeErr(e)); }
    return;
  }
  if (act === 'export') { if (E.dirty) toast('Exporting the values shown, including unsaved edits'); return kind === 'a1' ? exportA1(E.doc) : exportA2(E.doc); }
  if (act === 'print') { try { window.print(); } catch (e) { toast('Printing is blocked here. Use Export Excel instead.'); } return; }
}

function bindEditor() {
  const m = main();
  m.oninput = e => {
    const t = e.target; if (!E || !t.dataset || !t.dataset.f || t.tagName === 'SELECT' || E.readonly) return;
    setField(t, t.value);
  };
  m.onchange = e => {
    const t = e.target; if (!E || !t.dataset || !t.dataset.f || E.readonly) return;
    if (t.tagName === 'SELECT' || t.type === 'date') setField(t, t.value, true);
  };
  m.onclick = async e => {
    const b = e.target.closest('[data-ed]'); if (!b || !E) return;
    const act = b.dataset.ed, i = Number(b.dataset.i), j = Number(b.dataset.j), d = E.doc;
    const isA1 = E.kind === 'a1';
    switch (act) {
      case 'save': case 'finalize': case 'delete': case 'reopen': case 'export': case 'print': return editorAction(act);
      case 'newroad': return roadForm(null, rd => { d.roadId = rd.id; d.packageNo = rd.packageNo; markDirty(); isA1 ? renderA1() : renderA2(); });
      case 'usespan': { const s = Calc.n(d.chainageEnd) - Calc.n(d.chainageStart); d.segmentLength = String(s); $('#h-segmentLength').value = d.segmentLength; markDirty(); return refreshA1(); }
      case 'addrow': { const r = blankA1Row(); const prev = d.rows[d.rows.length - 1]; if (prev && Calc.n(prev.rollerWidth) > 0) r.rollerWidth = prev.rollerWidth; d.rows.push(r); markDirty(); drawA1Inputs(`select[data-i="${d.rows.length - 1}"][data-f="layer"]`); return refreshA1(); }
      case 'delrow': { const r = d.rows[i]; const filled = r.layer || r.vtsDistance || r.layerWidth; if (filled && !(await confirmDlg({ title: 'Remove this layer?', body: `Row ${i + 1}${r.layer ? ` (${esc(r.layer)})` : ''} and its inputs will be removed from this report.`, ok: 'Remove layer', danger: true }))) return; d.rows.splice(i, 1); markDirty(); drawA1Inputs(); return refreshA1(); }
      case 'up': case 'down': moveItem(d.rows, i, act === 'up' ? -1 : 1); markDirty(); drawA1Inputs(`[data-ed="${act}"][data-i="${act === 'up' ? i - 1 : i + 1}"]`); return refreshA1();
      case 'refreshrule': { const rule = resolveRule(d.rows[i].layer, d.rows[i].material); if (rule) { applyRuleToRow(d.rows[i], rule); markDirty(); drawA1Inputs(); refreshA1(); toast('Latest rule applied to this layer'); } return; }
      case 'addmat': { d.materials.push(blankMat()); markDirty(); drawA2Mats(`select[data-s="m"][data-i="${d.materials.length - 1}"][data-f="workItem"]`); refreshA2(); return; }
      case 'delmat': { const mm = d.materials[i]; if (!(await confirmDlg({ title: 'Remove this material?', body: `Material ${i + 1}${mm.workItem ? ` (${esc(mm.workItem)})` : ''} and its ${mm.trucks.length} truck row${mm.trucks.length === 1 ? '' : 's'} will be removed.`, ok: 'Remove material', danger: true }))) return; d.materials.splice(i, 1); markDirty(); drawA2Mats(); return refreshA2(); }
      case 'mup': case 'mdown': moveItem(d.materials, i, act === 'mup' ? -1 : 1); markDirty(); drawA2Mats(); return refreshA2();
      case 'addtruck': { const mm = d.materials[i]; const prev = mm.trucks[mm.trucks.length - 1]; const t = blankTruck(mm.trucks.length + 1); if (prev) { t.capacity = prev.capacity; t.fill = prev.fill; } mm.trucks.push(t); markDirty(); drawA2Mats(`input[data-s="t"][data-i="${i}"][data-j="${mm.trucks.length - 1}"][data-f="distanceKm"]`); return refreshA2(); }
      case 'deltruck': { d.materials[i].trucks.splice(j, 1); markDirty(); drawA2Mats(); return refreshA2(); }
      case 'lcreset': { const mm = d.materials[i], ms = S.data.materialTypes.get(mm.masterId); if (ms) { mm.lcFactor = String(ms.lcFactor); mm.lcOverridden = false; mm.ruleVersion = ms.version; markDirty(); drawA2Mats(); refreshA2(); } return; }
    }
  };
}
function setField(t, val, structural) {
  const d = E.doc, s = t.dataset.s, f = t.dataset.f, i = Number(t.dataset.i), j = Number(t.dataset.j);
  markDirty();
  if (E.kind === 'a1') {
    if (s === 'h') { d[f] = val; if (f === 'roadId') { const rr = road(val); d.packageNo = rr ? rr.packageNo : ''; return renderA1(); } return refreshA1(); }
    const r = d.rows[i];
    if (f === 'layer' || f === 'material') {
      if (val === '__new__') { t.value = r[f] || ''; return quickAddA1(f, i); }
      r[f] = val; syncRule(r);
      drawA1Inputs(`select[data-i="${i}"][data-f="${f}"]`); return refreshA1();
    }
    if (f === 'rollersText') { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; r.rollers = val.split(/[,\n]/).map(x => x.trim()).filter(Boolean); r.ruleOverridden = true; return refreshA1(); }
    if (f === 'passMin' || f === 'passMax') { r[f] = val; r.ruleOverridden = true; return refreshA1(); }
    r[f] = val; return refreshA1();
  }
  // Annexure II
  if (s === 'h') { d[f] = val; if (f === 'roadId') { const rr = road(val); d.packageNo = rr ? rr.packageNo : ''; return renderA2(); } return refreshA2(); }
  if (s === 'm') {
    const m = d.materials[i];
    if (f === 'workItem' || f === 'materialType') {
      if (val === '__new__') { t.value = m[f] || ''; return quickAddA2(f, i); }
      m[f] = val;
      if (f === 'materialType') {
        const ms = findMaterialType(val);
        if (ms) { m.masterId = ms.id; m.ruleVersion = ms.version; m.lcFactor = String(ms.lcFactor); m.lcOverridden = false; } else m.masterId = '';
      }
      drawA2Mats(`select[data-s="m"][data-i="${i}"][data-f="${f}"]`); return refreshA2();
    }
    m[f] = val;
    if (f === 'lcFactor') {
      const ms = S.data.materialTypes.get(m.masterId);
      m.lcOverridden = !!ms && Calc.n(val) !== ms.lcFactor;
      const h = $(`[data-lchint="${i}"]`, main());
      if (h && ms) h.innerHTML = m.lcOverridden ? `Edited. Master value ${ms.lcFactor}. <button class="linkish" data-ed="lcreset" data-i="${i}">Reset</button>` : (ms.typicalRange ? `From material type list (range ${esc(ms.typicalRange)})` : 'From material type list');
    }
    return refreshA2();
  }
  if (s === 't') { d.materials[i].trucks[j][f] = val; return refreshA2(); }
}

const LC_REFERENCE = `<div class="panel"><div class="panel-h"><h2>L/C basis, assumptions and references</h2><p class="sub">From the “LC Factors, Notes and reference” sheet of the Annexure II workbook</p></div><div class="panel-b formula">
  <p style="margin:0 0 10px">Compaction is carried out to achieve specified MDD; loose (transported) volume is always greater than compacted (placed) volume. <b>L/C factor = Loose volume ÷ Compacted volume.</b> Loose quantity required = Compacted quantity × L/C factor.</p>
  <h3 style="margin:14px 0 6px">Assumptions and limitations</h3>
  1. Soil type for “Earth Work” is not specified in the source data; the “ordinary soil” factor (1.20) is applied as a default. Replace with the soil-specific factor once the borrow-area soil classification (IS 1498) is known.<br>
  2. “Aggregate (Chips)” and “Aggregate (CMetal)” are assumed to be WMM and GSB aggregate respectively, based on common PMGSY BOQ naming convention. Confirm the actual pavement-layer assignment against the project DPR/BOQ before relying on these factors.<br>
  3. Recommended factors are typical/average values drawn from published literature and common site practice. Actual values vary with moisture content, gradation, compactive effort and roller type, and can deviate materially from the ranges shown (published earthwork guidance cites variation on the order of ±15% to ±33% around typical values).<br>
  4. For contractual or payment-critical quantities, factors should be verified by field trial: compare the loose bulk/rodded density of the delivered material (IS 2386 Part 3, or a field unit-weight box test) against the laboratory Maximum Dry Density for that specific source (IS 2720 Part 7 Standard Proctor, or Part 8 Modified Proctor).<br>
  5. “No. of Trips” assumes the GPS-VTS distance covered is a round-trip (to-and-fro) reading, hence division by (2 × Lead Distance). If the GPS system logs one-way distance only, remove the factor of 2 from the formula.<br>
  6. This calculation converts delivered loose volume to a compacted-equivalent volume for a desk-based accuracy check against the Material Master quantities. It does not itself certify field compaction; density of the placed layer must still be verified independently via field density tests (sand-replacement, core-cutter, or nuclear gauge) against the laboratory MDD.
  <h3 style="margin:14px 0 6px">References</h3>
  1. IS 1200 (Part 1):2000, Method of Measurement of Building and Civil Engineering Works: Earthwork.<br>

/* ---------------- user-resizable table columns ---------------- */
const COLW_KEY = 'gpsvts-colw';
let colW = {}; try { colW = JSON.parse(localStorage.getItem(COLW_KEY) || '{}') || {}; } catch (e) { }
function tableKey(t, idx) { const p = parseRoute(); return (p[0] || 'dash') + (p[1] ? (p[0] === 'settings' ? '-' + p[1] : '-edit') : '') + ':' + (t.id || t.className.replace(/\s+/g, '.')) + ':' + idx; }
function labelRespTables() {
  $$('table.grid.resp', main()).forEach(t => {
    if (t.dataset.lb === String(t.tBodies[0] ? t.tBodies[0].rows.length : 0)) return;
    const hr = t.tHead.rows[t.tHead.rows.length - 1];
    const labels = Array.from(hr.cells).map(th => (th.childNodes.length ? Array.from(th.childNodes).filter(n => !(n.classList && n.classList.contains('col-rz'))).map(n => n.textContent).join('') : '').trim());
    Array.from(t.tBodies[0] ? t.tBodies[0].rows : []).forEach(tr => Array.from(tr.cells).forEach((td, i) => { if (!td.hasAttribute('data-label')) td.setAttribute('data-label', labels[i] || ''); }));
    t.dataset.lb = String(t.tBodies[0] ? t.tBodies[0].rows.length : 0);
  });
}
function enableColResize() {
  labelRespTables();
  $$('table.grid', main()).forEach((t, ti) => {
    if (t.dataset.rz) return; t.dataset.rz = '1';
    const key = tableKey(t, ti);
    const hr = t.tHead.rows[t.tHead.rows.length - 1];
    Array.from(hr.cells).forEach((th, ci) => {
      const w = colW[key + ':' + ci]; if (w) { th.style.width = th.style.minWidth = w + 'px'; }
      if (ci === hr.cells.length - 1 && !th.textContent.trim()) return;
      const h = document.createElement('span'); h.className = 'col-rz no-print'; h.title = 'Drag to resize column. Double-click to reset.';
      th.appendChild(h);
      h.addEventListener('pointerdown', e => {
        e.preventDefault(); e.stopPropagation();
        const startX = e.clientX, startW = th.getBoundingClientRect().width;
        h.setPointerCapture(e.pointerId); h.classList.add('on'); document.body.classList.add('resizing');
        const move = ev => { const nw = Math.max(40, Math.round(startW + ev.clientX - startX)); th.style.width = th.style.minWidth = nw + 'px'; };
        const up = () => { h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.classList.remove('on'); document.body.classList.remove('resizing');
          colW[key + ':' + ci] = Math.round(th.getBoundingClientRect().width); try { localStorage.setItem(COLW_KEY, JSON.stringify(colW)); } catch (er) { } };
        h.addEventListener('pointermove', move); h.addEventListener('pointerup', up);
      });
      h.addEventListener('click', e => e.stopPropagation());
      h.addEventListener('dblclick', e => { e.stopPropagation(); th.style.width = th.style.minWidth = ''; delete colW[key + ':' + ci]; try { localStorage.setItem(COLW_KEY, JSON.stringify(colW)); } catch (er) { } });
    });
  });
}
new MutationObserver(() => requestAnimationFrame(enableColResize)).observe(document.getElementById('main'), { childList: true, subtree: true });

/* ---------------- start ---------------- */
async function init() {
  let db = null;
  try { db = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (db) {
    S.db = db; S.mode = 'cloud';
    try { const user = await window.claude.use('user'); if (user) { const w = await user.can('data.write'); if (w === false) S.readOnly = true; } } catch (e) { }
    await new Promise(resolve => {
      let pending = COLLS.length, done = false;
      const fin = () => { if (!done) { done = true; resolve(); } };
      COLLS.forEach(c => {
        let first = true;
        db.collection(c).onSnapshot(snap => {
          S.data[c] = new Map(snap.docs.map(d => [d.id, d.data()]));
          if (first) { first = false; if (--pending === 0) fin(); } else if (S.ready) onRemoteChange();
        }, err => { console.warn('db', c, err && err.code); if (first) { first = false; if (--pending === 0) fin(); } });
      });
      setTimeout(fin, 9000);
    });
  } else { S.mode = 'local'; loadLocal(); }
  S.ready = true; updateMode(); route();
}
init();
